name: Benchmark protocol tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s benchmark -p 'test_*.py'
      - name: C++ monotonic protocol and CPU timing tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror benchmark/test_protocol.cpp -o /tmp/protocol-test
          /tmp/protocol-test
