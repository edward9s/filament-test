name: Android test build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: filament-sdl3-test
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          umask 077
          key="$RUNNER_TEMP/filament-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key"
          if ! keytool -list -keystore "$key" -storepass:env ANDROID_KEYSTORE_PASSWORD \
              -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo '::error::Cannot open release keystore with the supplied password and alias'
            exit 1
          fi

      - name: Gradle 8.12.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Install Android SDK, CMake and NDK
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" \
            "cmake;3.22.1" "ndk;30.0.16248370"

      - name: Verify NDK matches pinned Filament native release
        run: |
          set -euo pipefail
          # Filament v1.78.1 build/common/versions: GITHUB_NDK_VERSION=30.0.16248370.
          # Mixing this prebuilt libc++ ABI with NDK r29 causes missing __hash_memory.
          ndk="$ANDROID_HOME/ndk/30.0.16248370"
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          echo "Filament 1.78.1 / NDK $(cat "$ndk/source.properties" | grep '^Pkg.Revision')"

      - name: Fetch pinned prebuilt Filament and SDL3
        run: bash scripts/download-deps.sh

      - name: Prepare forest textures, environment and materials
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/prepare-scene.py

      - name: Validate forest geometry
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -isystem .deps/host/filament/include \
            -Isrc tests/geometry.cpp src/Geometry.cpp -o /tmp/forest-geometry-test
          /tmp/forest-geometry-test
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Isrc tests/fps.cpp -o /tmp/forest-fps-test
          /tmp/forest-fps-test

      - name: Build signed Android arm64 release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/filament-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Inspect resulting APK
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libmain.so'
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libSDL3.so'
          python3 scripts/check-apk.py "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          cp "$apk" FilamentSDL3-test-arm64.apk

      - name: Replace rolling test prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="test-build"
          apk="FilamentSDL3-test-arm64.apk"
          notes="Latest successful build: #${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA}.
          SDL3 3.4.18 + Google Filament 1.78.1; arm64 release APK signed with the configured repository key.
          Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Filament + SDL3 test (latest #${GITHUB_RUN_NUMBER})" \
              --notes "$notes" --prerelease --latest=false
          else
            gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" \
              --title "Filament + SDL3 test (latest #${GITHUB_RUN_NUMBER})" \
              --notes "$notes" --prerelease --latest=false --target "$GITHUB_SHA"
          fi

      - name: Remove release signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/filament-release.jks"
