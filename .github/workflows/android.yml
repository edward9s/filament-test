name: Android test build

on:
  workflow_dispatch:
    inputs:
      fixed_resolution:
        description: 'Benchmark GLES and Vulkan at identical 100% resolution (disable dynamic resolution)'
        type: boolean
        default: false
      vulkan_sync:
        description: 'GPU lifetime diagnostic (slower; unsuitable for FPS comparisons)'
        type: boolean
        default: false

      vulkan_validation:
        description: 'Trace Vulkan object lifetime and synchronization errors (queue wait must be off)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: filament-sdl3-test
  cancel-in-progress: false

jobs:
  filament:
    name: Ensure pinned Filament fork SDK
    uses: ./.github/workflows/build_filament.yml

  sdl:
    name: Ensure current SDL3 static SDK
    uses: ./.github/workflows/build_sdl.yml

  jolt:
    name: Ensure current Jolt static SDK
    uses: ./.github/workflows/build_jolt.yml

  android:
    needs: [filament, sdl, jolt]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FOREST_VULKAN_VALIDATION: ${{ inputs.vulkan_validation && 'ON' || 'OFF' }}
      FOREST_VULKAN_SYNC: ${{ inputs.vulkan_sync && 'ON' || 'OFF' }}
      FOREST_FIXED_RESOLUTION: ${{ inputs.fixed_resolution && 'ON' || 'OFF' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate diagnostic selection
        run: |
          if [[ "$FOREST_VULKAN_SYNC" == ON && "$FOREST_VULKAN_VALIDATION" == ON ]]; then
            echo '::error::Select validation with vulkan_sync unchecked'
            exit 1
          fi

      - name: Preserve tablet-confirmed Vulkan APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/preserve-vulkan.sh

      - name: Fetch pinned Vulkan validation layer
        if: inputs.vulkan_validation
        run: python3 scripts/download-validation.py

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          umask 077
          key="$RUNNER_TEMP/filament-release.jks"
          # Whitespace may be introduced when pasting a wrapped Base64 value into Secrets.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$key"; then
            echo '::error::KEYSTORE_BASE64 must contain Base64-encoded keystore file bytes, not a path, password, or raw keystore'
            exit 1
          fi
          if [[ ! -s "$key" ]]; then
            echo '::error::KEYSTORE_BASE64 decoded to an empty keystore file'
            exit 1
          fi
          if ! keytool -list -keystore "$key" -storepass:env STORE_PASSWORD \
              -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo '::error::Cannot open decoded release keystore; verify STORE_PASSWORD and KEY_ALIAS'
            exit 1
          fi

      - name: Gradle 8.12.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Install Android SDK, CMake and NDK
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" \
            "cmake;3.22.1" "ndk;30.0.16248370"

      - name: Verify NDK matches pinned Filament native release
        run: |
          set -euo pipefail
          # Filament v1.78.1 build/common/versions: GITHUB_NDK_VERSION=30.0.16248370.
          # Mixing this prebuilt libc++ ABI with NDK r29 causes missing __hash_memory.
          ndk="$ANDROID_HOME/ndk/30.0.16248370"
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          echo "Filament 1.78.1 / NDK $(cat "$ndk/source.properties" | grep '^Pkg.Revision')"

      - name: Verify Android arm64 ThinLTO linker
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/30.0.16248370"
          cmake="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          build="$RUNNER_TEMP/forest-lto-smoke"
          "$cmake" -S tests/lto -B "$build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DCMAKE_MAKE_PROGRAM="$ANDROID_HOME/cmake/3.22.1/bin/ninja" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          "$cmake" --build "$build" --verbose | tee "$RUNNER_TEMP/forest-lto-build.log"
          grep -Fq -- '-flto=thin' "$RUNNER_TEMP/forest-lto-build.log"
          grep -Fq -- '-fuse-ld=lld' "$RUNNER_TEMP/forest-lto-build.log"
          if grep -Fq -- '-fuse-ld=gold' "$RUNNER_TEMP/forest-lto-build.log"; then
            echo '::error::Android LTO selected obsolete gold linker'
            exit 1
          fi

      - name: Fetch prebuilt Filament and repository SDL3 static SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/download-deps.sh

      - name: Prepare forest textures, environment and materials
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/prepare-scene.py

      - name: Validate OpenGL ES particle visibility
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
          python3 tests/particles.py

      - name: Validate forest geometry and effects
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -isystem .deps/host/filament/include \
            -Isrc tests/geometry.cpp src/Geometry.cpp -o /tmp/forest-geometry-test
          /tmp/forest-geometry-test
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Isrc tests/fps.cpp -o /tmp/forest-fps-test
          /tmp/forest-fps-test
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -isystem .deps/host/filament/include \
            -Isrc tests/effects.cpp src/EffectsGeometry.cpp src/Geometry.cpp -o /tmp/forest-effects-test
          /tmp/forest-effects-test
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -Isrc tests/uploads.cpp -o /tmp/forest-uploads-test
          /tmp/forest-uploads-test

      - name: Render the complete scene with Vulkan and recreate its swapchain
        run: |
          sudo apt-get install -y --no-install-recommends \
            clang-18 llvm-18 lld-18 libc++-18-dev libc++abi-18-dev mesa-vulkan-drivers
          g++ -std=c++20 -O2 -Wall -Wextra -Werror tests/pixels.cpp -o /tmp/pixels-test
          /tmp/pixels-test
          bash scripts/test-vulkan.sh

      - name: Build signed Android arm64 release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/filament-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Inspect resulting APK
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          unzip -tqq "$apk"
          layer='lib/arm64-v8a/libVkLayer_khronos_validation.so'
          if [[ "$FOREST_VULKAN_VALIDATION" == ON ]]; then
            unzip -Z1 "$apk" | grep -Fx "$layer"
          elif unzip -Z1 "$apk" | grep -Fxq "$layer"; then
            echo '::error::Unexpected validation layer in normal build'
            exit 1
          fi
          "$tools/aapt2" dump badging "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libmain.so'
          if unzip -Z1 "$apk" | grep -Fxq 'lib/arm64-v8a/libSDL3.so'; then
            echo "::error::Unexpected libSDL3.so: SDL3 must be statically linked"
            exit 1
          fi
          main_so="$RUNNER_TEMP/filament-main.so"
          unzip -p "$apk" 'lib/arm64-v8a/libmain.so' > "$main_so"
          test -s "$main_so"
          ndk_bin="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$ndk_bin/llvm-readelf" --dyn-syms "$main_so" | grep -E '[[:space:]]JNI_OnLoad([[:space:]]|$)'
          python3 scripts/check-apk.py "$apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          cp "$apk" FilamentSDL3-test-arm64.apk

      - name: Replace rolling test prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="test-build"
          apk="FilamentSDL3-test-arm64.apk"
          digest="$(sha256sum "$apk" | cut -d ' ' -f1)"
          size="$(stat -c '%s' "$apk")"
          sdl_version="$(sed -n 's/^SDL_VERSION=//p' .deps/sdl3/BUILD-INFO.txt)"
          [[ "$sdl_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          source_revision="$(python3 -c 'import json;print(json.load(open("filament.json"))["revision"])')"
          notes="Latest successful build: #${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA}.
          SDL3 ${sdl_version} (repository static SDK) + Filament fork ${source_revision}; arm64 release APK signed with the configured repository key.
          Filament SDK LTO: ON. Vulkan material uniform batching: ON.
          Fixed 100% scene resolution: ${FOREST_FIXED_RESOLUTION} (OFF = dynamic 65-100% per axis).
          Vulkan synchronization diagnostic: ${FOREST_VULKAN_SYNC}.
          Vulkan lifetime/synchronization validation: ${FOREST_VULKAN_VALIDATION}.
          Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          APK size: ${size} bytes.
          SHA-256: ${digest}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Filament + SDL3 test (latest #${GITHUB_RUN_NUMBER})" \
              --notes "$notes" --prerelease --latest=false
          else
            gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" \
              --title "Filament + SDL3 test (latest #${GITHUB_RUN_NUMBER})" \
              --notes "$notes" --prerelease --latest=false --target "$GITHUB_SHA"
          fi

      - name: Remove release signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/filament-release.jks"


