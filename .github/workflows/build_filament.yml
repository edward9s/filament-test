name: Build pinned Filament fork SDK

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: filament-sdk-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: Checkout application dependency pin
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test SDK checksum and source validation
        run: python3 tests/sdk.py

      - name: Read pinned fork revision
        id: source
        run: python3 scripts/download-filament.py --info >> "$GITHUB_OUTPUT"

      - name: Check immutable SDK release
        id: check
        env:
          TAG: ${{ steps.source.outputs.tag }}
          REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,assets > "$RUNNER_TEMP/sdk-release.json"; then
            python3 - "$RUNNER_TEMP/sdk-release.json" "$REVISION" <<'PY'
          import json,sys
          release=json.load(open(sys.argv[1]))
          assert 'SOURCE_COMMIT='+sys.argv[2] in release['body'], 'SDK release source pin mismatch'
          assert {x['name'] for x in release['assets']} == {'filament-linux.tgz','filament-android-arm64.tgz','SHA256SUMS'}, 'Incomplete SDK release'
          PY
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact fork source
        if: steps.check.outputs.ready != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.revision }}
          path: filament-source
          persist-credentials: false
          sparse-checkout: |
            build
            filament
            libs
            shaders
            third_party
            tools
            samples
            test

      - name: Install host build dependencies
        if: steps.check.outputs.ready != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake clang-18 \
            libc++-18-dev libc++abi-18-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcomposite-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libegl1-mesa-dev libgl1-mesa-dev

      - name: Install matching Android NDK
        if: steps.check.outputs.ready != 'true'
        env:
          NDK_VERSION: ${{ steps.source.outputs.ndk }}
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          "$sdkmanager" "ndk;$NDK_VERSION"

      - name: Build and test complete Linux and Android SDKs
        if: steps.check.outputs.ready != 'true'
        run: bash scripts/build-filament.sh filament-source

      - name: Publish SDK for this source revision
        if: steps.check.outputs.ready != 'true'
        env:
          TAG: ${{ steps.source.outputs.tag }}
          REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/sdk-notes.txt"
          printf 'SOURCE_COMMIT=%s\nSOURCE_REPOSITORY=edward9s/filament\nComplete fork SDK with command-buffer-owned pipelines.\n' "$REVISION" > "$notes"
          gh release create "$TAG" .generated/sdk/filament-linux.tgz \
            .generated/sdk/filament-android-arm64.tgz .generated/sdk/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Filament fork SDK ${REVISION:0:12}" --notes-file "$notes"
