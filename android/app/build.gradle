plugins {
    id 'com.android.application'
}

def filamentSdk = file('../../.deps/filament').absolutePath
def sdl3Sdk = file('../../.deps/sdl3').absolutePath
def fixedResolution = System.getenv('FOREST_FIXED_RESOLUTION') ?: 'OFF'
if (!(fixedResolution in ['ON', 'OFF'])) {
    throw new GradleException('FOREST_FIXED_RESOLUTION must be ON or OFF')
}
def vulkanSync = System.getenv('FOREST_VULKAN_SYNC') ?: 'OFF'
if (!(vulkanSync in ['ON', 'OFF'])) {
    throw new GradleException('FOREST_VULKAN_SYNC must be ON or OFF')
}
def vulkanValidation = System.getenv('FOREST_VULKAN_VALIDATION') ?: 'OFF'
if (!(vulkanValidation in ['ON', 'OFF'])) {
    throw new GradleException('FOREST_VULKAN_VALIDATION must be ON or OFF')
}
if (vulkanValidation == 'ON' && vulkanSync == 'ON') {
    throw new GradleException('Validation requires FOREST_VULKAN_SYNC=OFF')
}
def signing = ['KEYSTORE_PATH', 'STORE_PASSWORD',
               'KEY_ALIAS', 'KEY_PASSWORD'].collectEntries { name ->
    [(name): System.getenv(name)]
}

android {
    namespace 'com.edward9s.filamentsdl3test'
    compileSdk 35
    ndkVersion '30.0.16248370'

    defaultConfig {
        applicationId 'com.edward9s.filamentsdl3test'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName (vulkanValidation == 'ON' ? '0.2.0-vkvalidate' : vulkanSync == 'ON' ? '0.2.0-vksync' : '0.2.0')
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DFILAMENT_SDK=${filamentSdk}", "-DSDL3_SDK=${sdl3Sdk}", "-DFOREST_FIXED_RESOLUTION=${fixedResolution}", "-DFOREST_VULKAN_SYNC=${vulkanSync}", "-DFOREST_VULKAN_VALIDATION=${vulkanValidation}"
            }
        }
    }

    sourceSets {
        main.assets.srcDirs += ['../../.generated/assets']
        if (vulkanValidation == 'ON') {
            main.jniLibs.srcDirs += ['../../.deps/validation']
        }
        main.java.srcDirs += ['../../.deps/sdl3/android/java']
    }

    signingConfigs {
        release {
            if (signing.KEYSTORE_PATH) {
                storeFile file(signing.KEYSTORE_PATH)
            }
            storePassword signing.STORE_PASSWORD
            keyAlias signing.KEY_ALIAS
            keyPassword signing.KEY_PASSWORD
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }
}

// Missing assets are a build error, not a blank screen on the phone.
tasks.register('verifySceneAssets') {
    doLast {
        def root = file('../../.generated/assets/forest')
        def names = ['surface.filamat', 'foliage.filamat', 'canopy.filamat', 'hud.filamat', 'effects.filamat', 'water.filamat', 'canopy.rgba', 'environment_ibl.ktx', 'environment_skybox.ktx']
        ['ground', 'stone', 'bark'].each { material ->
            ['albedo', 'normal', 'arm'].each { map -> names.add("${material}_${map}.rgba") }
        }
        names.each { name ->
            def asset = new File(root, name)
            if (!asset.isFile() || asset.length() == 0) {
                throw new GradleException("Missing scene asset ${name}. Run python3 scripts/prepare-scene.py first.")
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifySceneAssets' }

// Release builds require the supplied key; never fall back to a debug or new key.
tasks.register('verifyReleaseSigning') {
    doLast {
        signing.each { name, value ->
            if (!value) throw new GradleException("Missing release signing environment variable: ${name}")
        }
        if (!file(signing.KEYSTORE_PATH).isFile()) {
            throw new GradleException('Release keystore file does not exist')
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'verifyReleaseSigning' }

// A diagnostic without its layer is an invalid build.
if (vulkanValidation == 'ON') {
    tasks.register('verifyValidationLayer') {
        doLast {
            def layer = file('../../.deps/validation/arm64-v8a/libVkLayer_khronos_validation.so')
            if (!layer.isFile() || layer.length() == 0) {
                throw new GradleException('Run python3 scripts/download-validation.py first')
            }
        }
    }
    tasks.named('preBuild').configure { dependsOn 'verifyValidationLayer' }
}

