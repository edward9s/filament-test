plugins {
    id 'com.android.application'
}

def filamentSdk = file('../../.deps/filament').absolutePath
def signing = ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD',
               'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'].collectEntries { name ->
    [(name): System.getenv(name)]
}

android {
    namespace 'com.edward9s.filamentsdl3test'
    compileSdk 35
    ndkVersion '30.0.16248370'

    defaultConfig {
        applicationId 'com.edward9s.filamentsdl3test'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DFILAMENT_SDK=${filamentSdk}"
            }
        }
    }

    sourceSets {
        main.assets.srcDirs += ['../../.generated/assets']
    }

    signingConfigs {
        release {
            if (signing.ANDROID_KEYSTORE_PATH) {
                storeFile file(signing.ANDROID_KEYSTORE_PATH)
            }
            storePassword signing.ANDROID_KEYSTORE_PASSWORD
            keyAlias signing.ANDROID_KEY_ALIAS
            keyPassword signing.ANDROID_KEY_PASSWORD
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }
}

dependencies {
    implementation files('libs/SDL3.aar')
}

// Missing assets are a build error, not a blank screen on the phone.
tasks.register('verifySceneAssets') {
    doLast {
        def root = file('../../.generated/assets/forest')
        def names = ['surface.filamat', 'foliage.filamat', 'canopy.filamat', 'hud.filamat', 'canopy.rgba', 'environment_ibl.ktx', 'environment_skybox.ktx']
        ['ground', 'stone', 'bark'].each { material ->
            ['albedo', 'normal', 'arm'].each { map -> names.add("${material}_${map}.rgba") }
        }
        names.each { name ->
            def asset = new File(root, name)
            if (!asset.isFile() || asset.length() == 0) {
                throw new GradleException("Missing scene asset ${name}. Run python3 scripts/prepare-scene.py first.")
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifySceneAssets' }

// Release builds require the supplied key; never fall back to a debug or new key.
tasks.register('verifyReleaseSigning') {
    doLast {
        signing.each { name, value ->
            if (!value) throw new GradleException("Missing release signing environment variable: ${name}")
        }
        if (!file(signing.ANDROID_KEYSTORE_PATH).isFile()) {
            throw new GradleException('Release keystore file does not exist')
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'verifyReleaseSigning' }
