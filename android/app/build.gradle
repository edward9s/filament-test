plugins {
    id 'com.android.application'
}

def filamentSdk = file('../../.deps/filament').absolutePath

android {
    namespace 'com.edward9s.filamentsdl3test'
    compileSdk 35
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'com.edward9s.filamentsdl3test'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DFILAMENT_SDK=${filamentSdk}"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }
}

dependencies {
    implementation files('libs/SDL3.aar')
}
